name: Enrich 104 Jobs with AI KSA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run AI KSA & Bilingual JD Analysis
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/enrich_existing_104.py

      - name: Commit enriched data/jobs_104.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jobs_104.json
          git diff --staged --quiet || git commit -m "chore: enrich 104 jobs with AI KSA & bilingual summary"
          git push
