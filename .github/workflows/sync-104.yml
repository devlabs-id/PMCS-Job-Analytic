name: Sync 104 Job Bank Daily

on:
  schedule:
    - cron: "0 22 * * *" # 06:00 CST (UTC+8) setiap hari
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync-104:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch latest 104 jobs
        env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/fetch_104.py

      - name: Commit and push if data/jobs_104.json changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs_104.json
          if git diff --staged --quiet; then
            echo "No changes in data/jobs_104.json"
          else
            git commit -m "chore: daily sync 104 jobs [skip ci]"
            git push
          fi
