name: Sync 104 Job Bank Daily

on:
  schedule:
    - cron: "0 22 * * *" # 06:00 CST (UTC+8) setiap hari
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync-104:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch latest 104 vacancies
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/fetch_104.py
        continue-on-error: true

      - name: Run AI KSA & Bilingual JD Analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/enrich_existing_104.py

      - name: Commit updated data/jobs_104.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs_104.json
          git diff --staged --quiet || git commit -m "chore: daily 104 sync and AI enrichment"
          git push
