name: Sync 104 Jobs Dataset

on:
  schedule:
    - cron: "0 22 * * *" # Setiap hari pukul 06:00 waktu Taiwan (UTC+8)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install httpx
      - run: python scripts/fetch_104.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jobs_104.json
          git commit -m "chore: update 104 jobs dataset" || exit 0
          git push
